spring.application.name=finlit-backend

# ─── Server ──────────────────────────────────────────────────────────────────
# Runs on port 3000 with a /api prefix so it matches the frontend's axios base
# URL (http://localhost:3000/api) with zero changes needed in the app.
server.port=3000
server.servlet.context-path=/api

# ─── Database (PostgreSQL) ───────────────────────────────────────────────────
# Connects to a local database named "finlit". The password is read from a
# DB_PASSWORD environment variable (set it in your IntelliJ run config) so it is
# never committed to source control.
spring.datasource.url=jdbc:postgresql://localhost:5432/finlit
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
# ddl-auto=update: Hibernate creates/updates tables automatically from the Java
# entity classes, so you never write SQL by hand for the schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── JWT / Auth ──────────────────────────────────────────────────────────────
# The secret signs every token — keep it long and private. Override in
# production with an APP_JWT_SECRET environment variable.
app.jwt.secret=${APP_JWT_SECRET:finlit-dev-secret-change-me-to-a-much-longer-random-value-1234567890}
# Access token valid 24h; refresh token valid 30 days (per proposal NFR).
app.jwt.access-expiration-ms=86400000
app.jwt.refresh-expiration-ms=2592000000

# ─── AI Tutor (Google Gemini) ────────────────────────────────────────────────
# The key stays on the server and is never sent to the app. Provide it with a
# GEMINI_API_KEY environment variable. Without it, /tutor/chat returns 503.
app.gemini.api-key=${GEMINI_API_KEY:}
# "gemini-flash-latest" tracks the current flash model. Override with a
# GEMINI_MODEL env var if you want to pin a specific model.
app.gemini.model=${GEMINI_MODEL:gemini-flash-latest}
