spring.application.name=finlit-backend

# ─── Local secrets ───────────────────────────────────────────────────────────
# Loads backend/secrets.properties if present (gitignored). Holds the real
# MAIL_* and GEMINI_API_KEY values so they never enter source control. Absent is
# fine — every setting below has a safe fallback.
spring.config.import=optional:file:secrets.properties

# ─── Server ──────────────────────────────────────────────────────────────────
# Locally binds to 3000; in the cloud, hosting platforms (Render/Railway) inject
# a PORT env var that the app must use, so we read ${PORT} with a 3000 fallback.
# The /api prefix matches the frontend's axios base URL.
server.port=${PORT:3000}
server.servlet.context-path=/api

# ─── Database (PostgreSQL) ───────────────────────────────────────────────────
# Connects to a local database named "finlit". The password is read from a
# DB_PASSWORD environment variable (set it in your IntelliJ run config) so it is
# never committed to source control.
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-hidden-sky-at4jfgm2-pooler.c-9.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.keepalive-time=120000
# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
# ddl-auto=update: Hibernate creates/updates tables automatically from the Java
# entity classes, so you never write SQL by hand for the schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── JWT / Auth ──────────────────────────────────────────────────────────────
# The secret signs every token — keep it long and private. Override in
# production with an APP_JWT_SECRET environment variable.
app.jwt.secret=${APP_JWT_SECRET:finlit-dev-secret-change-me-to-a-much-longer-random-value-1234567890}
# Access token valid 24h; refresh token valid 30 days (per proposal NFR).
app.jwt.access-expiration-ms=86400000
app.jwt.refresh-expiration-ms=2592000000

# ─── Email (SMTP) ────────────────────────────────────────────────────────────
# Sends account-verification codes. Credentials come from secrets.properties (or
# env vars). If username is blank, EmailService logs the code to the console
# instead of sending, so the app still works without email configured.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
app.mail.from=${MAIL_FROM:FinLit <no-reply@finlit.app>}
# How long a verification code stays valid.
app.verification.code-ttl-minutes=15

# ─── AI Tutor (Google Gemini) ────────────────────────────────────────────────
# The key stays on the server and is never sent to the app. Provide it with a
# GEMINI_API_KEY environment variable. Without it, /tutor/chat returns 503.
app.gemini.api-key=${GEMINI_API_KEY:}
# Pinned to a stable, versioned model. Do NOT use the "gemini-flash-latest"
# alias: Google silently re-points it (it recently resolved to the retired
# gemini-2.0-flash and 404'd), which made /tutor/chat fail. Override with a
# GEMINI_MODEL env var if you want a different model.
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
# Newer flash models "think" before replying, adding ~2-3s latency. This caps
# that thinking to keep the tutor snappy (tested: 6.6s -> ~4s). Raise for deeper
# answers, or set to -1 to use the model's default. 0 is rejected by some models.
app.gemini.thinking-budget=${GEMINI_THINKING_BUDGET:128}

# ─── Payments (Paystack) ─────────────────────────────────────────────────────
# The SECRET key (not the public key used by the app) — used server-side to
# verify a transaction reference with Paystack before granting premium. Never
# trust the client's word that a payment succeeded. Without it, POST
# /profile/premium returns 503.
app.paystack.secret-key=${PAYSTACK_SECRET_KEY:}
